
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS3 HEN - Diagnóstico</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #FFD097;
      color: #222;
      margin: 20px;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 20px;
      background: #fff0dc;
      border: 1px solid #d8a56f;
    }
    button {
      padding: 10px 16px;
      margin: 8px 0;
      cursor: pointer;
    }
    #results {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h1>PS3 HEN — Diagnóstico</h1>
  <p>Esta página verifica a disponibilidade dos arquivos.
     Ela não instala nem ativa o HEN.</p>

  <button id="check" type="button">
    Verificar arquivos
  </button>

  <pre id="results">Aguardando verificação...</pre>
</main>

<script>
"use strict";

const files = [
  "493/index.html",
  "493/HEN.P3T",
  "493/.htaccess",
  "ps3hen_v100.js"
];

async function checkFiles() {
  const output = document.getElementById("results");
  const button = document.getElementById("check");

  button.disabled = true;
  output.textContent = "Verificando arquivos...\n";

  try {
    for (const file of files) {
      const url = new URL(file, document.baseURI);

      try {
        const response = await fetch(url.href, {
          method: "GET",
          cache: "no-store"
        });

        output.textContent +=
          `${response.ok ? "OK" : "ERRO"} ` +
          `${response.status} — ${file}\n`;
      } catch (error) {
        output.textContent +=
          `FALHA DE REDE — ${file}\n`;
      }
    }
  } finally {
    button.disabled = false;
  }
}

document.getElementById("check")
  .addEventListener("click", checkFiles);
</script>
</body>
</html>
